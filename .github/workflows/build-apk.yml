name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Clean Project Structure
        run: |
          # 1. Buat project baru di folder terpisah
          flutter create --org com.supra.ecu --project-name ecu_dashboard_supra clean_project
          
          # 2. Ambil file main.dart buatan Anda dan timpa ke project bersih
          # Jika main.dart Anda ada di root atau di dalam lib/, perintah ini akan mendeteksinya
          if [ -f "lib/main.dart" ]; then
            cp -f lib/main.dart clean_project/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp -f main.dart clean_project/lib/main.dart
          fi

      - name: Install Dependencies
        run: |
          cd clean_project
          flutter pub get

      - name: Build APK (Release Mode)
        run: |
          cd clean_project
          flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-ECU-SupraX125
          path: clean_project/build/app/outputs/flutter-apk/app-release.apk
