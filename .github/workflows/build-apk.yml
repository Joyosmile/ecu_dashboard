name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Inject Android Files Safely
        run: |
          # Membuat file project baru di folder terpisah agar tidak menimpa kode Anda
          flutter create --org com.supra.ecu --project-name ecu_dashboard_supra temp_project
          
          # Memindahkan folder android, ios, dan web yang dibutuhkan ke folder utama Anda
          cp -r temp_project/android ./android
          
          # Bersihkan folder sementara
          rm -rf temp_project

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-ECU-SupraX125
          path: build/app/outputs/flutter-apk/app-release.apk
