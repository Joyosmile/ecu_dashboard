name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Base Flutter Project
        run: |
          flutter create --org com.supra.ecu --project-name ecu_dashboard_supra base_project
          
      - name: Checkout Your Repository Code
        uses: actions/checkout@v4
        with:
          path: repo_code

      - name: Sync Dashboard Code
        run: |
          cp -f repo_code/pubspec.yaml base_project/pubspec.yaml
          cp -f repo_code/lib/main.dart base_project/lib/main.dart

      - name: Install Dependencies
        run: |
          cd base_project
          flutter pub get

      - name: Build APK (Release Mode)
        run: |
          cd base_project
          flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-ECU-SupraX125
          path: base_project/build/app/outputs/flutter-apk/app-release.apk
